version: '3.8'

services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - custom-network  # Attach to the custom network

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CREATE_TOPICS: "news_topic:6:1"
    depends_on:
      - zookeeper
    networks:
      - custom-network  # Attach to the custom network

  mongo:
    image: mongo
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - custom-network  # Attach to the custom network

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "4040:8080"
      - "7077:7077"
    volumes:
      - ./:/opt/news-sentimental
    networks:
      - custom-network

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    volumes:
      - ./:/opt/news-sentimental
    networks:
      - custom-network

  producer:
    build: .
    container_name: producer
    command: python3 /opt/news-sentimental/producer/news_producer.py
    restart: on-failure
    depends_on:
      - kafka
    volumes:
      - ./:/opt/news-sentimental
    networks:
      - custom-network

  spark-submit:
    env_file:
      - .env.cloudflare
      - .env.nepali
    build: .
    container_name: spark-submit
    restart: on-failure
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MIN_REQUEST_INTERVAL_SECONDS: ${GEMINI_MIN_REQUEST_INTERVAL_SECONDS:-6}
    depends_on:
      - spark-worker
      - kafka
      - mongo
    volumes:
      - ./:/opt/news-sentimental
      - spark-checkpoint-v2:/tmp/spark-checkpoint
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6,org.mongodb.spark:mongo-spark-connector_2.12:10.3.0
      --conf "spark.mongodb.output.uri=mongodb://mongo:27017/newsdb.sentiments"
      --py-files /opt/news-sentimental/spark/sentiment_models.py,/opt/news-sentimental/spark/sentiment_pipeline.py
      /opt/news-sentimental/spark/sentiment_stream.py
    networks:
      - custom-network


  dashboard:
    build: .
    container_name: dashboard
    command: ["python3", "-m", "streamlit", "run", "/opt/news-sentimental/dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      MONGO_URI: mongodb://mongo:27017/
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - mongo
    volumes:
      - ./:/opt/news-sentimental
    networks:
      - custom-network

volumes:
  mongo-data:
  spark-checkpoint:
  spark-checkpoint-v2:


networks:
  custom-network:  # Define a custom network
    driver: bridge
